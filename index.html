<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyomissing Field Hockey Stats</title>
<style>
  :root {
    --navy: #1a2744;
    --gold: #c9a24b;
    --paper: #f7f6f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--paper);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card {
    max-width: 560px;
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 1.5rem;
    border: 2px solid var(--navy);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 1.5rem;
    color: var(--navy);
  }
  h1 {
    font-size: 1.9rem;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
  }
  .sub {
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    color: #5a5a5a;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }
  .status {
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    color: var(--gold);
    border-top: 1px solid #ddd8cf;
    padding-top: 1.25rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">W</div>
    <h1>Wyomissing Field Hockey</h1>
    <div class="sub">Season Stats &amp; Game Reports</div>
    <div class="status">Site plumbing check &mdash; game reports coming soon</div>
  </div>
</body>
</html>
